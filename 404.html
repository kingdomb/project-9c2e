<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GA Granite</title>
    <meta name="robots" content="noindex, nofollow" />
    <!--
      GitHub Pages serves this file for any path it doesn't recognize as a
      real file (e.g. a direct link to /project-9c2e/before-after). Since
      there's no server-side rewrite available, this re-encodes the path
      into a query string and redirects to index.html, which decodes it
      back on load (see the matching inline script in index.html) and lets
      React Router take over from there. Standard pattern:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1 // keep "/project-9c2e" as the app root
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
